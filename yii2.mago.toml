# Shared settings for Yii2 applications. Import this file, not the package's mago.toml:
# extends = "vendor/ilyakabanov/mago-yii2-extension/yii2.mago.toml"

[extension-hosts.yii2]
command = ["php", "vendor/bin/mago-yii2-worker.php"]

# Initial Yii2 style defaults, not full yii2-coding-standards parity.
[formatter]
preset = "psr-12"
excludes = [
    "**/i18n/data/**",
    "**/views/errorHandler/**",
    "**/requirements/**",
    "**/ProfileTarget.php",
]
single-quote = true
space-around-assignment-in-declare = false
space-within-grouping-parenthesis = false
expand-use-groups = true

[linter]
excludes = [
    "**/i18n/data/**",
    "**/views/errorHandler/**",
    "**/requirements/**",
    "**/ProfileTarget.php",
]

[linter.rules]
array-style = { enabled = true, level = "error", style = "short" }
block-statement = { enabled = true, level = "error" }
class-name = { enabled = true, level = "error" }
constant-name = { enabled = true, level = "error" }
lowercase-keyword = { enabled = true, level = "error" }
lowercase-type-hint = { enabled = true, level = "error" }
method-name = { enabled = true, level = "error", camel = true }
no-closing-tag = { enabled = true, level = "error" }
no-short-opening-tag = { enabled = true, level = "error" }
no-side-effects-with-declarations = { enabled = true, level = "error", exclude = ["tests/**/_bootstrap.php", "web/index.php", "web/index-test.php"] }
no-trailing-space = { enabled = true, level = "error" }
optional-param-order = { enabled = true, level = "error" }
require-namespace = { enabled = true, level = "error", exclude = ["**/m[0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9]_*.php"] }
single-class-per-file = { enabled = true, level = "error" }
